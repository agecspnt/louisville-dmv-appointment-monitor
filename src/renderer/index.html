<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMV Appointment Monitor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>DMV Appointment Monitor</h1>
      </header>

      <section class="panel controls">
        <div class="row">
          <label for="appointmentType">Appointment Type</label>
          <select id="appointmentType">
            <option value="permit">Written Test (56)</option>
            <option value="road_test">Road Test (55)</option>
          </select>
        </div>

        <div class="row">
          <label for="locationName">Appointment Location</label>
          <select id="locationName"></select>
          <button id="refreshLocationsBtn" class="btn secondary">Refresh Locations</button>
        </div>

        <div class="row">
          <label for="intervalSec">Base Interval (sec)</label>
          <input id="intervalSec" type="number" min="1" value="60" />
        </div>

        <div class="row">
          <label for="headless">Headless</label>
          <input id="headless" type="checkbox" checked />
        </div>

        <div class="row">
          <label for="autoBook">Auto Book</label>
          <input id="autoBook" type="checkbox" />
        </div>

        <div class="row">
          <label for="autoSubmit">Auto Submit</label>
          <input id="autoSubmit" type="checkbox" checked />
        </div>

        <div class="section-title">Applicant Info (memory only)</div>

        <div class="row">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" placeholder="Given name" />
        </div>

        <div class="row">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" placeholder="Family name" />
        </div>

        <div class="row">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="name@example.com" />
        </div>

        <div class="row">
          <label for="phone">Phone</label>
          <input id="phone" type="tel" placeholder="Phone number" />
        </div>

        <div class="row">
          <label for="receiveTexts">Receive Texts</label>
          <input id="receiveTexts" type="checkbox" />
        </div>

        <div class="row grow">
          <label for="barkKey">Bark Key</label>
          <input id="barkKey" type="text" placeholder="Paste your Bark device key" />
          <button id="testBarkBtn" class="btn secondary">Test Bark</button>
        </div>

        <div class="actions">
          <button id="startBtn" class="btn primary">Start Monitoring</button>
          <button id="stopBtn" class="btn danger" disabled>Stop</button>
          <button id="checkBtn" class="btn secondary">Check Once</button>
          <button id="bookNowBtn" class="btn warning">Book Earliest Now</button>
          <button id="openPageBtn" class="btn secondary">Open DMV Page</button>
        </div>
      </section>

      <section class="panel status">
        <div id="statusText">Status: Idle</div>
        <div id="lastCheck">Last check: N/A</div>
        <div id="earliestTime">Earliest: N/A</div>
        <div id="availability">Availability: Unknown</div>
      </section>

      <section class="panel logs">
        <div class="logs-title">Logs</div>
        <div id="logView"></div>
      </section>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
